name: Build Windows MSI
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and unpack catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out-win, package-input/catalog | Out-Null
          javac -encoding UTF-8 -d out-win src/VtxApp.java
          if ($LASTEXITCODE -ne 0) { throw 'Java compilation failed' }
          jar --create --file VtxConfig.jar --main-class VtxApp -C out-win .
          if ($LASTEXITCODE -ne 0) { throw 'JAR creation failed' }
          Copy-Item VtxConfig.jar package-input/
          foreach ($n in 1..3) {
            $part = "catalog-part-$n.zip"
            if (!(Test-Path $part)) { throw "Missing $part" }
            Expand-Archive -LiteralPath $part -DestinationPath package-input/catalog -Force
          }
          if (!(Test-Path package-input/catalog/site_catalog.tsv)) { throw 'Missing site_catalog.tsv' }
          $photos = @(Get-ChildItem package-input/catalog/photos -Filter *.jpg -File)
          if ($photos.Count -ne 501) { throw "Expected 501 photos, found $($photos.Count)" }
      - name: Build portable Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          jpackage --type app-image --name VtxConfig --input package-input --main-jar VtxConfig.jar --dest dist-portable --app-version 2.2.9 --java-options '-Xmx512m'
          if ($LASTEXITCODE -ne 0) { throw 'Portable app build failed' }
          if (!(Test-Path dist-portable/VtxConfig/VtxConfig.exe)) { throw 'Missing VtxConfig.exe' }
          # Keep the editable catalog beside VtxConfig.exe as requested.
          Copy-Item package-input/catalog dist-portable/VtxConfig/catalog -Recurse -Force
          Compress-Archive -Path dist-portable/VtxConfig -DestinationPath VtxConfig-2.2.9-Portable-Windows.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: VtxConfig-2.2.9-Portable-Windows
          path: VtxConfig-2.2.9-Portable-Windows.zip
          if-no-files-found: error
      - name: Try MSI build (optional)
        continue-on-error: true
        shell: pwsh
        run: |
          jpackage --type msi --name VtxConfig --input package-input --main-jar VtxConfig.jar --dest dist-win --app-version 2.2.9 --win-shortcut --win-menu --win-dir-chooser --java-options '-Xmx512m' --verbose
          if ($LASTEXITCODE -ne 0) { Write-Warning "MSI failed with code $LASTEXITCODE; portable ZIP is already uploaded." }
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('dist-win/*.msi') != '' }}
        with:
          name: VtxConfig-2.2.9-Windows-MSI
          path: dist-win/*.msi
          if-no-files-found: ignore
